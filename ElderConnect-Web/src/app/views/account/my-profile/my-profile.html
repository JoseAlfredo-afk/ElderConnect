<div class="container-fluid min-vh-100 bg-white p-4">
  <div class="p-4 p-md-5 rounded-5" style="background-color: #eaf4ff;">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-dark m-0">Meu Perfil</h2>
    </div>

    <div *ngIf="alertaSucesso" class="alert alert-success rounded-4 border-0 mb-4 shadow-sm"
      style="background-color: #d1e7dd;">
      Dados atualizados com sucesso!
    </div>

    <div class="row g-4">
      <div class="col-md-7">
        <div class="card border-0 shadow-sm rounded-5 p-4" style="background-color: #dbeeff;">
          <h5 class="fw-bold text-dark mb-4">Dados Pessoais</h5>

          <form (ngSubmit)="salvarPerfil()">
            <div class="mb-3">
              <label class="form-label fw-bold text-dark">Nome Completo</label>
              <input type="text" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="usuario.nome"
                name="nome">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold text-dark">E-mail</label>
              <input type="email" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="usuario.email"
                name="email">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold text-dark">Telefone</label>
                <input type="text" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="usuario.telefone"
                  name="telefone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold text-dark">CPF</label>
                <input type="text" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="usuario.cpf"
                  name="cpf" disabled>
              </div>
            </div>

            <div class="text-end mt-3">
              <button type="submit" class="btn btn-success fw-bold px-4 py-2 rounded-4 border-0 shadow-sm"
                style="background-color: #2ecc71;">
                Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-5 p-4" style="background-color: #dbeeff;">
          <h5 class="fw-bold text-dark mb-4">Alterar Senha</h5>

          <form (ngSubmit)="alterarSenha()">
            <div class="mb-3">
              <label class="form-label fw-bold text-dark">Senha Atual</label>
              <input type="password" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="senhaAtual"
                name="senhaAtual">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold text-dark">Nova Senha</label>
              <input type="password" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="novaSenha"
                name="novaSenha">
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-dark">Confirmar Nova Senha</label>
              <input type="password" class="form-control rounded-3 border-0 px-3 py-2" [(ngModel)]="confirmarSenha"
                name="confirmarSenha">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-4 border-0 shadow-sm"
              style="background-color: #0d6efd;">
              Atualizar Senha
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
