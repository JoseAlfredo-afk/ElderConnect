<div class="container py-4">

  <div class="mb-3">
    <button class="btn btn-outline-secondary btn-sm fw-semibold rounded-3" (click)="voltar()">
      ← Voltar
    </button>
  </div>

  <div class="p-4 p-md-5 rounded-5" style="background-color: #ebf5ff;">

    <h2 class="fw-bold text-dark mb-4">Meu Perfil</h2>

    <div class="row g-4">

      <div class="col-12 col-lg-6">
        <div class="bg-white p-4 rounded-4 shadow-sm border-0 h-100 d-flex flex-column justify-content-between">
          <div>
            <h5 class="fw-bold text-dark mb-3">Dados Pessoais</h5>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Nome Completo</label>
              <input type="text" class="form-control rounded-3 border-secondary-subtle py-2 text-dark"
                [(ngModel)]="usuario.nome" name="nome" placeholder="Seu nome completo">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">E-mail</label>
              <input type="email" class="form-control rounded-3 border-secondary-subtle py-2 text-dark"
                [(ngModel)]="usuario.email" name="email" placeholder="seu@email.com">
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6 mb-3">
                <label class="form-label fw-semibold text-dark">Telefone</label>
                <input type="text" class="form-control rounded-3 border-secondary-subtle py-2 text-dark"
                  [(ngModel)]="usuario.telefone" name="telefone" placeholder="(00) 00000-0000">
              </div>

              <div class="col-12 col-md-6 mb-3">
                <label class="form-label fw-semibold text-dark">CPF</label>
                <input type="text" class="form-control rounded-3 border-0 bg-light text-secondary py-2"
                  [(ngModel)]="usuario.cpf" name="cpf" readonly>
              </div>
            </div>
          </div>

          <div class="text-end mt-4">
            <button class="btn btn-success fw-bold px-4 py-2 rounded-3 border-0 shadow-sm"
              style="background-color: #00bf63;" (click)="salvarAlteracoes()">
              Salvar Alterações
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="bg-white p-4 rounded-4 shadow-sm border-0 h-100 d-flex flex-column justify-content-between">
          <div>
            <h5 class="fw-bold text-dark mb-3">Alterar Senha</h5>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Senha Atual</label>
              <input type="password" class="form-control rounded-3 border-secondary-subtle py-2"
                [(ngModel)]="senhaAtual" name="senhaAtual" placeholder="••••••••">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Nova Senha</label>
              <input type="password" class="form-control rounded-3 border-secondary-subtle py-2" [(ngModel)]="novaSenha"
                name="novaSenha" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Confirmar Nova Senha</label>
              <input type="password" class="form-control rounded-3 border-secondary-subtle py-2"
                [(ngModel)]="confirmarNovaSenha" name="confirmarNovaSenha" placeholder="Confirme a nova senha">
              <small *ngIf="confirmarNovaSenha && novaSenha !== confirmarNovaSenha" class="text-danger mt-1 d-block">
                As senhas não coincidem.
              </small>
            </div>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary fw-bold w-100 py-2 rounded-3 border-0 shadow-sm"
              style="background-color: #005ce6;" (click)="atualizarSenha()">
              Atualizar Senha
            </button>
          </div>
        </div>
      </div>

    </div>

    <div class="mt-4 pt-3 border-top border-secondary-subtle text-end">
      <button class="btn btn-outline-danger fw-bold px-4 py-2 rounded-3" (click)="abrirModalExclusao()">
        Excluir Perfil
      </button>
    </div>

  </div>
</div>

<div *ngIf="exibindoModalExclusao" class="modal fade show d-block" style="background-color: rgba(0,0,0,0.5);"
  (click)="cancelarExclusao()">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg rounded-4 p-4 text-center">

      <div
        class="bg-danger-subtle text-danger rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
        style="width: 72px; height: 72px;">
        <i class="bi bi-exclamation-triangle-fill fs-1 text-danger"></i>
      </div>

      <h4 class="fw-bold text-dark mb-2">Excluir conta?</h4>
      <p class="text-muted small mb-4">Tem certeza de que deseja excluir permanentemente o seu perfil? Esta ação não
        poderá ser desfeita.</p>

      <div class="d-flex gap-2 justify-content-center">
        <button type="button" class="btn btn-light fw-bold px-4 py-2 rounded-3 border text-secondary flex-grow-1"
          (click)="cancelarExclusao()">
          Cancelar
        </button>
        <button type="button" class="btn btn-danger fw-bold px-4 py-2 rounded-3 flex-grow-1"
          (click)="confirmarExclusaoPerfil()">
          Sim, excluir
        </button>
      </div>

    </div>
  </div>
</div>
