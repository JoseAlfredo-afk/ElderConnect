<div class="container-fluid min-vh-100 bg-white d-flex align-items-center justify-content-center p-4">
  <div class="p-4 p-md-5 rounded-5 shadow-sm text-center"
    style="background-color: #eaf4ff; max-width: 480px; width: 100%;">

    <h3 class="fw-bold text-dark mb-2">Recuperar Senha</h3>
    <p class="text-secondary mb-4 fs-6">Informe seu e-mail cadastrado para receber as instruções de redefinição.</p>

    <div *ngIf="mensagemSucesso" class="alert alert-success rounded-4 border-0 mb-4" style="background-color: #d1e7dd;">
      <i class="bi bi-check-circle-fill me-2"></i>E-mail de recuperação enviado com sucesso!
    </div>

    <form (ngSubmit)="enviarEmail()">
      <div class="text-start mb-4">
        <label class="form-label fw-bold text-dark ms-1">E-mail</label>
        <input type="email" class="form-control form-control-lg rounded-4 border-0 shadow-sm px-3"
          placeholder="seu@email.com" [(ngModel)]="email" name="email" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-4 fw-bold border-0 shadow-sm mb-3"
        style="background-color: #0d6efd;">
        Enviar E-mail
      </button>

      <a routerLink="/account/sign-in" class="text-decoration-none text-secondary fw-semibold fs-6">
        Voltar para o Login
      </a>
    </form>

  </div>
</div>
