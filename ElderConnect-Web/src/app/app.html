<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2 shadow-sm">
  <div class="container-fluid px-4 d-flex align-items-center justify-content-between">

    <a
      class="d-flex flex-column align-items-center text-decoration-none"
      routerLink="/home"
      style="cursor: pointer;"
    >
      <img
        src="elderconnect.png"
        alt="ElderConnect Logo"
        height="48"
        class="d-block bg-transparent border-0 p-0 m-0"
      >
    </a>

    <div class="d-flex align-items-center gap-4 mx-auto">

      <!-- INÍCIO -->
      <a
        (click)="irParaInicio()"
        class="text-decoration-none text-dark fw-bold"
        style="font-size: 1.05rem; cursor: pointer;"
      >
        Início
      </a>

      <!-- BUSCAR CUIDADORES -->
      <a
        *ngIf="podeBuscarCuidadores()"
        routerLink="/dashboard/search-caregiver"
        class="text-decoration-none text-dark fw-bold"
        style="font-size: 1.05rem;"
      >
        Buscar cuidadores
      </a>

      <!-- SOBRE -->
      <a
        routerLink="/about"
        class="text-decoration-none text-dark fw-bold"
        style="font-size: 1.05rem;"
      >
        Sobre
      </a>

      <!-- AJUDA -->
      <a
        routerLink="/help"
        class="text-decoration-none text-dark fw-bold"
        style="font-size: 1.05rem;"
      >
        Ajuda
      </a>

    </div>

    <div class="d-flex align-items-center">

      <!-- USUÁRIO NÃO LOGADO -->
      <div
        *ngIf="!authService.usuarioLogado()"
        class="d-flex align-items-center gap-2"
      >

        <a
          routerLink="/account/sign-in"
          class="btn btn-light bg-white px-3 py-1.5 rounded-3 text-dark fw-bold border border-secondary-subtle"
          style="font-size: 0.95rem;"
        >
          Entrar
        </a>

        <a
          routerLink="/account/sign-up"
          class="btn btn-success px-3 py-1.5 rounded-3 fw-bold border-0"
          style="font-size: 0.95rem;"
        >
          Cadastrar
        </a>

      </div>

      <!-- USUÁRIO LOGADO -->
      <div
        *ngIf="authService.usuarioLogado()"
        class="d-flex align-items-center gap-3"
      >

        <span
          class="text-dark fw-bold"
          style="font-size: 1rem;"
        >
          Olá, {{ authService.usuarioAtual()?.fullname }}!
        </span>

        <!-- MEU PERFIL -->
        <a
          routerLink="/dashboard/profile"
          class="btn btn-outline-primary px-3 py-1.5 rounded-3 fw-bold"
          style="font-size: 0.95rem;"
        >
          Meu Perfil
        </a>

        <!-- SAIR -->
        <a
          routerLink="/home"
          (click)="authService.logout()"
          class="btn btn-danger px-3 py-1.5 rounded-3 fw-bold border-0 text-decoration-none"
          style="font-size: 0.95rem; cursor: pointer;"
        >
          Sair
        </a>

      </div>

    </div>

  </div>
</nav>


<!-- ALERTA DE LOGIN -->
<div
  *ngIf="mostrarAlertaLogin()"
  class="alert alert-success d-flex align-items-center justify-content-center gap-2 border-0 shadow position-fixed end-0 py-2 px-4 rounded-3 text-success fw-bold me-4 animate__animated animate__fadeIn"
  style="
    background-color: #d1e7dd;
    z-index: 1050;
    top: 90px;
    min-width: 240px;
    font-size: 0.9rem;
  "
>
  <i class="bi bi-check-circle-fill"></i>
  Logado com sucesso!
</div>


<!-- ALERTA DE CADASTRO -->
<div
  *ngIf="mostrarAlertaCadastro()"
  class="alert alert-success d-flex align-items-center justify-content-center gap-2 border-0 shadow position-fixed end-0 py-2 px-4 rounded-3 text-success fw-bold me-4 animate__animated animate__fadeIn"
  style="
    background-color: #d1e7dd;
    z-index: 1050;
    top: 90px;
    min-width: 240px;
    font-size: 0.9rem;
  "
>
  <i class="bi bi-check-circle-fill"></i>
  Cadastrado com sucesso!
</div>


<!-- CONTEÚDO DAS PÁGINAS -->
<main class="w-100">
  <router-outlet></router-outlet>
</main>
